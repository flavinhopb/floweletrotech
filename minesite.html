<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Eletrotech | Links Oficiais</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e56f00; /* Laranja Flow */
            --dark: #1a1a1a;
            --light: #f4f4f4;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 40px 0;
            text-align: center;
        }

        header img {
            max-width: 180px;
            height: auto;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding-bottom: 50px;
        }

        .cta {
            font-size: 1.1em;
            font-weight: 300;
            margin-bottom: 30px;
            color: #ccc;
            letter-spacing: 1px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .button-container a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            background-color: var(--glass);
            color: var(--dark);
            padding: 18px 25px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Ícone centralizado à esquerda com espaço fixo */
        .button-container a i {
            font-size: 1.4em;
            width: 30px;
            text-align: center;
        }

        /* Efeito de Hover */
        .button-container a:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(229, 111, 0, 0.3);
        }

        /* Estilo específico para WhatsApp em destaque */
        .btn-whatsapp:hover {
            background-color: #25d366 !important;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3) !important;
        }

        .footer-text {
            margin-top: 40px;
            font-size: 0.8em;
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <header>
        <img src="flow-eletrotech.png" alt="Logo Flow Eletrotech">
    </header>

    <div class="container">
        <p class="cta">Instalações Elétricas</p>
        
        <div class="button-container">
            <a href="https://floweletrotech.com.br/" target="_blank">
                <i class="fas fa-globe"></i>
                <span>Nosso Site</span>
                <i class="fas fa-chevron-right" style="font-size: 0.8em; opacity: 0.5;"></i>
            </a>

            <a href="https://www.instagram.com/floweletrotech/" target="_blank">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
                <i class="fas fa-chevron-right" style="font-size: 0.8em; opacity: 0.5;"></i>
            </a>

            <a href="https://www.tiktok.com/@seuusuario" target="_blank">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
                <i class="fas fa-chevron-right" style="font-size: 0.8em; opacity: 0.5;"></i>
            </a>

            <a href="https://www.youtube.com/channel/seucanal" target="_blank">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
                <i class="fas fa-chevron-right" style="font-size: 0.8em; opacity: 0.5;"></i>
            </a>

            <a href="https://wa.me/5581996847246" target="_blank" class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i>
                <span>Falar no WhatsApp</span>
                <i class="fas fa-chevron-right" style="font-size: 0.8em; opacity: 0.5;"></i>
            </a>
        </div>

        <p class="footer-text">© 2024 Flow Eletrotech - Todos os direitos reservados.</p>
    </div>

</body>
</html>
