<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Energia - Challenge</title>
    <style>
        :root {
            --primary: #f1c40f;
            --bg: #121212;
            --surface: #1e1e1e;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { 
            overflow: hidden; position: fixed; width: 100%; height: 100%; 
            margin: 0; padding: 0; background: var(--bg); color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        /* Telas de Overlay */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: 0.3s; padding: 20px; text-align: center;
        }

        .hidden { display: none; pointer-events: none; opacity: 0; }

        /* Estilo UI */
        .game-header {
            width: 100%; max-width: 600px; padding: 15px;
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            align-items: center; background: var(--surface);
        }

        .stats-item { font-size: 0.9rem; font-weight: bold; }
        .timer-val { color: var(--primary); font-family: monospace; font-size: 1.2rem; }

        #canvas-container {
            width: 95vw; max-width: 600px; aspect-ratio: 6 / 4;
            margin-top: 20px; position: relative;
        }

        canvas { 
            width: 100%; height: 100%; background: #181818; 
            border: 2px solid #333; border-radius: 12px;
        }

        /* Botões Modernos */
        .btn {
            background: var(--primary); color: #000; border: none;
            padding: 15px 40px; font-size: 1.1rem; font-weight: 800;
            border-radius: 50px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.2s; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
        }
        .btn:active { transform: scale(0.95); }

        .btn-restart { margin-top: 20px; padding: 10px 25px; font-size: 0.8rem; background: #333; color: #fff; }

        h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--primary); }
        .best-time { color: var(--success); margin-top: 10px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="screen-start" class="overlay">
        <h1>ENERGIA⚡</h1>
        <p>Conecte a bateria à lâmpada sem tocar nos obstáculos.</p>
        <button class="btn" onclick="startGame()">Iniciar Jogo</button>
    </div>

    <div id="screen-end" class="overlay hidden">
        <h1 id="end-title">VITÓRIA! 🎉</h1>
        <p>Você completou todos os níveis.</p>
        <div style="font-size: 1.5rem; margin: 20px 0;">
            Tempo Total: <span id="final-time" class="timer-val">00:00</span>
        </div>
        <div class="best-time" id="best-time-display">Melhor Tempo: --:--</div>
        <button class="btn" style="margin-top:30px" onclick="startGame()">Jogar Novamente</button>
    </div>

    <div class="game-header">
        <div class="stats-item" id="level-display">NÍVEL 1</div>
        <div class="stats-item timer-val" id="timer-display">00:00.0</div>
        <div class="stats-item" id="lives-display" style="text-align: right;">❤️❤️❤️❤️❤️</div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <button class="btn btn-restart" onclick="restartFullGame()">Reiniciar Tudo</button>
    <div id="status" style="margin-top: 10px; color: var(--primary); font-weight: bold;"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerDisplay = document.getElementById('timer-display');
        const statusText = document.getElementById('status');

        let currentLevel = 0;
        let lives = 5;
        let isDrawing = false;
        let points = [];
        let gameActive = false;

        // Cronômetro
        let startTime;
        let timerInterval;
        let finalSeconds = 0;

       const levels = [
    // 1-5: Introdução e Aquecimento
    { start: {x: 50, y: 200}, end: {x: 550, y: 200}, obstacles: [] },
    { start: {x: 50, y: 50}, end: {x: 550, y: 350}, obstacles: [{x: 250, y: 0, w: 50, h: 300}] },
    { start: {x: 50, y: 200}, end: {x: 550, y: 200}, obstacles: [{x: 150, y: 0, w: 30, h: 250}, {x: 350, y: 150, w: 30, h: 250}] },
    { start: {x: 30, y: 30}, end: {x: 570, y: 370}, obstacles: [{x: 0, y: 80, w: 500, h: 20}, {x: 100, y: 180, w: 500, h: 20}, {x: 0, y: 280, w: 500, h: 20}] },
    { start: {x: 300, y: 30}, end: {x: 300, y: 370}, obstacles: [{x: 0, y: 100, w: 280, h: 200}, {x: 320, y: 100, w: 280, h: 200}] },

    // 6-10: Precisão e Curvas
    { start: {x: 50, y: 200}, end: {x: 550, y: 200}, obstacles: [{x: 150, y: 0, w: 40, h: 150}, {x: 150, y: 250, w: 40, h: 150}, {x: 250, y: 100, w: 40, h: 200}, {x: 350, y: 0, w: 40, h: 150}, {x: 350, y: 250, w: 40, h: 150}] },
    { start: {x: 50, y: 50}, end: {x: 550, y: 50}, obstacles: [{x: 0, y: 150, w: 250, h: 20}, {x: 350, y: 150, w: 250, h: 20}, {x: 280, y: 0, w: 40, h: 300}] },
    { start: {x: 30, y: 200}, end: {x: 570, y: 200}, obstacles: [{x: 100, y: 0, w: 20, h: 180}, {x: 100, y: 220, w: 20, h: 180}, {x: 200, y: 50, w: 20, h: 300}, {x: 300, y: 0, w: 20, h: 180}, {x: 300, y: 220, w: 20, h: 180}, {x: 400, y: 50, w: 20, h: 300}] },
    { start: {x: 50, y: 50}, end: {x: 50, y: 350}, obstacles: [{x: 150, y: 50, w: 450, h: 300}, {x: 0, y: 150, w: 100, h: 100}] },
    { start: {x: 30, y: 30}, end: {x: 570, y: 30}, obstacles: [{x: 0, y: 80, w: 520, h: 20}, {x: 80, y: 160, w: 520, h: 20}, {x: 0, y: 240, w: 520, h: 20}, {x: 80, y: 320, w: 520, h: 20}] },

    // 11-15: O Funil e Labirintos (CORRIGIDO O 14)
    { start: {x: 300, y: 50}, end: {x: 300, y: 350}, obstacles: [{x: 0, y: 180, w: 285, h: 40}, {x: 315, y: 180, w: 285, h: 40}] },
    { start: {x: 50, y: 350}, end: {x: 550, y: 50}, obstacles: [{x: 100, y: 100, w: 400, h: 200}, {x: 0, y: 0, w: 50, h: 300}, {x: 550, y: 100, w: 50, h: 300}] },
    { start: {x: 30, y: 370}, end: {x: 570, y: 30}, obstacles: [{x: 100, y: 0, w: 20, h: 320}, {x: 200, y: 80, w: 20, h: 320}, {x: 300, y: 0, w: 20, h: 320}, {x: 400, y: 80, w: 20, h: 320}, {x: 500, y: 0, w: 20, h: 320}] },
    { 
        start: {x: 50, y: 50}, 
        end: {x: 300, y: 200}, 
        obstacles: [
            {x: 200, y: 50, w: 210, h: 10},  // Topo
            {x: 200, y: 50, w: 10, h: 300},  // Esquerda
            {x: 400, y: 50, w: 10, h: 100},  // Direita (Abertura criada aqui!)
            {x: 400, y: 250, w: 10, h: 100}, // Direita inferior
            {x: 200, y: 340, w: 210, h: 10}, // Baixo
            {x: 250, y: 150, w: 100, h: 10}  // Obstáculo interno perto da lâmpada
        ] 
    },
    { start: {x: 30, y: 200}, end: {x: 570, y: 200}, obstacles: [{x: 0, y: 0, w: 600, h: 175}, {x: 0, y: 225, w: 600, h: 175}] },

    // 16-20: Hardcore (Espaços Mínimos)
    { start: {x: 50, y: 50}, end: {x: 550, y: 350}, obstacles: [{x: 0, y: 100, w: 550, h: 12}, {x: 50, y: 200, w: 550, h: 12}, {x: 0, y: 300, w: 550, h: 12}] },
    { start: {x: 300, y: 200}, end: {x: 570, y: 370}, obstacles: [{x: 250, y: 150, w: 100, h: 10}, {x: 250, y: 250, w: 100, h: 10}, {x: 250, y: 150, w: 10, h: 110}, {x: 350, y: 150, w: 10, h: 50}, {x: 0, y: 0, w: 600, h: 100}, {x: 0, y: 320, w: 450, h: 80}] },
    { start: {x: 30, y: 30}, end: {x: 30, y: 370}, obstacles: [{x: 80, y: 0, w: 12, h: 360}, {x: 160, y: 40, w: 12, h: 360}, {x: 240, y: 0, w: 12, h: 360}, {x: 320, y: 40, w: 12, h: 360}, {x: 400, y: 0, w: 12, h: 360}, {x: 480, y: 40, w: 12, h: 360}, {x: 560, y: 0, w: 12, h: 360}] },
    { start: {x: 50, y: 200}, end: {x: 550, y: 200}, obstacles: [{x: 100, y: 180, w: 400, h: 8}, {x: 100, y: 212, w: 400, h: 8}] }, 
    { start: {x: 30, y: 30}, end: {x: 570, y: 370}, obstacles: [
        {x: 60, y: 0, w: 12, h: 340}, {x: 120, y: 60, w: 12, h: 340},
        {x: 180, y: 0, w: 12, h: 340}, {x: 240, y: 60, w: 12, h: 340},
        {x: 300, y: 0, w: 12, h: 340}, {x: 360, y: 60, w: 12, h: 340},
        {x: 420, y: 0, w: 12, h: 340}, {x: 480, y: 60, w: 12, h: 340},
        {x: 540, y: 0, w: 12, h: 340}
    ]}
];

        function formatTime(ms) {
            let totalSeconds = ms / 1000;
            let m = Math.floor(totalSeconds / 60);
            let s = Math.floor(totalSeconds % 60);
            let ds = Math.floor((ms % 1000) / 100);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ds}`;
        }

        function updateTimer() {
            if (!gameActive) return;
            const now = Date.now();
            finalSeconds = now - startTime;
            timerDisplay.innerText = formatTime(finalSeconds);
        }

        function startGame() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-end').classList.add('hidden');
            currentLevel = 0;
            lives = 5;
            points = [];
            gameActive = true;
            startTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);
            updateUI();
            draw();
        }

        function endGame(won) {
            gameActive = false;
            clearInterval(timerInterval);
            const screenEnd = document.getElementById('screen-end');
            const endTitle = document.getElementById('end-title');
            const finalTimeLabel = document.getElementById('final-time');
            const bestTimeLabel = document.getElementById('best-time-display');

            screenEnd.classList.remove('hidden');

            if (won) {
                endTitle.innerText = "VOCÊ VENCEU! 🏆";
                finalTimeLabel.innerText = formatTime(finalSeconds);
                
                // Salvar Recorde
                let record = localStorage.getItem('bestTime');
                if (!record || finalSeconds < record) {
                    localStorage.setItem('bestTime', finalSeconds);
                    bestTimeLabel.innerText = "NOVO RECORDE: " + formatTime(finalSeconds);
                } else {
                    bestTimeLabel.innerText = "Melhor Tempo: " + formatTime(parseInt(record));
                }
            } else {
                endTitle.innerText = "FIM DE JOGO 💀";
                endTitle.style.color = "var(--danger)";
                finalTimeLabel.innerText = "--:--";
            }
        }

        // --- LÓGICA DE JOGO BASE ---
        function lineRectIntersect(x1, y1, x2, y2, rx, ry, rw, rh) {
            if (x2 >= rx && x2 <= rx + rw && y2 >= ry && y2 <= ry + rh) return true;
            const intersect = (x3, y3, x4, y4) => {
                let uA = ((x4-x3)*(y1-y3)-(y4-y3)*(x1-x3))/((y4-y3)*(x2-x1)-(x4-x3)*(y2-y1));
                let uB = ((x2-x1)*(y1-y3)-(y2-y1)*(x1-x3))/((y4-y3)*(x2-x1)-(x4-x3)*(y2-y1));
                return (uA >= 0 && uA <= 1 && uB >= 0 && uB <= 1);
            };
            return intersect(rx, ry, rx+rw, ry) || intersect(rx, ry+rh, rx+rw, ry+rh) || intersect(rx, ry, rx, ry+rh) || intersect(rx+rw, ry, rx+rw, ry+rh);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const level = levels[currentLevel];
            if (!level) return;

            // Obstáculos
            ctx.fillStyle = "#333";
            level.obstacles.forEach(obs => {
                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            });

            // Objetivos
            ctx.font = "30px Arial";
            ctx.fillText("🔋", level.start.x - 15, level.start.y + 10);
            ctx.fillText("💡", level.end.x - 15, level.end.y + 10);

            // Cabo
            if (points.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = varProp('--primary');
                ctx.lineWidth = 6;
                ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
            }
        }

        function varProp(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

        function startAction(e) {
            if (!gameActive) return;
            const pos = getPos(e);
            if (Math.hypot(pos.x - levels[currentLevel].start.x, pos.y - levels[currentLevel].start.y) < 40) {
                isDrawing = true; points = [pos];
                statusText.innerText = "";
            }
        }

        function moveAction(e) {
            if (!isDrawing || !gameActive) return;
            e.preventDefault();
            const pos = getPos(e);
            const level = levels[currentLevel];
            const last = points[points.length - 1];

            for (let obs of level.obstacles) {
                if (lineRectIntersect(last.x, last.y, pos.x, pos.y, obs.x, obs.y, obs.w, obs.h)) {
                    fail(); return;
                }
            }

            if (Math.hypot(pos.x - level.end.x, pos.y - level.end.y) < 30) {
                isDrawing = false; nextLevel();
            } else {
                points.push(pos);
                draw();
            }
        }

        function fail() {
            isDrawing = false; points = []; lives--;
            updateUI();
            if (lives <= 0) endGame(false);
            draw();
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel >= levels.length) {
                endGame(true);
            } else {
                points = [];
                updateUI();
                draw();
            }
        }

        function updateUI() {
            document.getElementById('level-display').innerText = "NÍVEL " + (currentLevel + 1);
            document.getElementById('lives-display').innerText = "❤️".repeat(lives);
        }

        function restartFullGame() {
            clearInterval(timerInterval);
            document.getElementById('screen-start').classList.remove('hidden');
            document.getElementById('screen-end').classList.add('hidden');
        }

        canvas.addEventListener('mousedown', startAction);
        window.addEventListener('mousemove', moveAction);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchstart', startAction);
        window.addEventListener('touchmove', moveAction);
        window.addEventListener('touchend', () => isDrawing = false);

    </script>
</body>
</html>
