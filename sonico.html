<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sonic & Friends: Ultra DX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: #020208;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 900px;
      max-height: 500px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 50px rgba(0, 229, 255, 0.2);
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 6, 14, 0.94);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 100;
      padding: 10px;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .overlay-screen.escondido {
      opacity: 0;
      visibility: hidden;
      pointer-events: none !important;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f5d4 0%, #0066ff 50%, #7b00ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
      text-align: center;
    }

    h1.victory-title {
      background: linear-gradient(135deg, #ffcc00 0%, #ff9900 50%, #ff0055 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .victory-stats {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffcc00;
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
      background: rgba(255, 204, 0, 0.1);
      border: 1px solid rgba(255, 204, 0, 0.3);
      padding: 10px 24px;
      border-radius: 12px;
    }

    .instructions {
      font-size: 0.8rem;
      color: #b0c4de;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      text-align: center;
    }

    .character-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .char-card {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .char-card:hover { transform: translateY(-2px); }
    .char-card[data-char="sonic"].ativo { border-color: #00e5ff; color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
    .char-card[data-char="tails"].ativo { border-color: #ffb703; color: #ffcc00; box-shadow: 0 0 15px rgba(255, 183, 3, 0.4); }
    .char-card[data-char="shadow"].ativo { border-color: #ff2a4b; color: #ff5277; box-shadow: 0 0 15px rgba(255, 42, 75, 0.4); }
    .char-card[data-char="knuckles"].ativo { border-color: #e61919; color: #ff4d4d; box-shadow: 0 0 15px rgba(230, 25, 25, 0.4); }
    .char-card[data-char="amy"].ativo { border-color: #ff4d94; color: #ff85c0; box-shadow: 0 0 15px rgba(255, 77, 148, 0.4); }

    .btn-action-group {
      display: flex;
      gap: 12px;
    }

    .btn-play {
      background: linear-gradient(90deg, #00e5ff, #0055ff);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 900;
      padding: 12px 35px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
      transition: all 0.2s ease;
    }

    .btn-play.gold {
      background: linear-gradient(90deg, #ffcc00, #ff8800);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
      color: #000;
    }

    .btn-play:active { transform: scale(0.95); }

    #game-hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
    }

    #game-hud.ativo { opacity: 1; pointer-events: auto; }

    .hud-info {
      display: flex;
      gap: 16px;
      font-weight: 900;
      font-size: 0.95rem;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 8px;
    }

    .rings-count { color: #ffcc00; text-shadow: 0 0 8px rgba(255, 204, 0, 0.6); }
    .stage-name { color: #00e5ff; text-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }

    .btn-menu-return {
      background: rgba(5, 7, 10, 0.8);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #touch-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      height: 110px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
    }

    #touch-controls.ativo { opacity: 1; pointer-events: auto; }

    .dpad, .action-btns { display: flex; gap: 12px; }

    .touch-btn {
      width: 58px;
      height: 58px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.3rem;
      color: #fff;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .touch-btn:active {
      background: rgba(0, 229, 255, 0.35);
      border-color: #00e5ff;
      transform: scale(0.92);
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <!-- TELA DE MENU -->
    <div id="menu-screen" class="overlay-screen">
      <h1>SONIC & FRIENDS</h1>
      <p class="instructions">Use os botões na tela no Celular ou A/D, Espaço e Z no Teclado!</p>

      <div class="character-container">
        <div class="char-card ativo" data-char="sonic" onclick="selecionarPersonagem('sonic')">Sonic</div>
        <div class="char-card" data-char="tails" onclick="selecionarPersonagem('tails')">Tails</div>
        <div class="char-card" data-char="shadow" onclick="selecionarPersonagem('shadow')">Shadow</div>
        <div class="char-card" data-char="knuckles" onclick="selecionarPersonagem('knuckles')">Knuckles</div>
        <div class="char-card" data-char="amy" onclick="selecionarPersonagem('amy')">Amy</div>
      </div>

      <button class="btn-play" onclick="iniciarJogo()">JOGAR</button>
    </div>

    <!-- TELA DE VITÓRIA -->
    <div id="victory-screen" class="overlay-screen escondido">
      <h1 class="victory-title">STAGE CLEAR!</h1>
      <p class="instructions">Você concluiu todas as fases!</p>

      <div class="victory-stats" id="victory-rings-text">
        TOTAL RINGS: 0
      </div>

      <div class="btn-action-group">
        <button class="btn-play gold" onclick="reiniciarJogo()">JOGAR NOVAMENTE</button>
        <button class="btn-menu-return" style="padding: 12px 24px; font-size: 1rem;" onclick="voltarAoMenu()">MENU</button>
      </div>
    </div>

    <div id="game-hud">
      <div class="hud-info">
        <span class="stage-name" id="hud-stage">Fase 1: Green Hill</span>
        <span class="rings-count" id="hud-rings">RINGS: 0</span>
      </div>
      <button class="btn-menu-return" onclick="voltarAoMenu()">Menu</button>
    </div>

    <div id="touch-controls">
      <div class="dpad">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <div class="action-btns">
        <div class="touch-btn" id="btn-skill" style="background: rgba(255,0,100,0.2); border-color: rgba(255,0,100,0.5);">Z</div>
        <div class="touch-btn" id="btn-jump" style="background: rgba(0,229,255,0.2); border-color: rgba(0,229,255,0.5);">▲</div>
      </div>
    </div>

    <canvas id="gameCanvas" width="850" height="480"></canvas>
  </div>

  <script>
    let estadoJogo = 'MENU';
    let personagemSelecionado = 'sonic';
    let animationFrameId = null;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const chaoY = canvas.height - 40;
    let faseAtual = 0;
    let totalRings = 0;
    let tempoGlobal = 0;

    let jogador = {
      x: 50,
      y: chaoY - 40,
      largura: 32,
      altura: 40,
      velocidadeX: 5.5,
      velocidadeY: 0,
      gravidade: 0.6,
      forcaPulo: -12.5,
      emNoChao: true,
      olhandoDireita: true,
      
      cooldownHabilidade: 0,
      spindashAtivo: false,
      tempoSpindash: 0,
      socoAtivo: 0,
      marteloAtivo: 0,
      anguloRotacao: 0,
      animFrame: 0,
      
      checkpointX: 50,
      checkpointY: chaoY - 40
    };

    const fases = [
      {
        nome: "1. Green Hill Zone",
        bg: ["#051329", "#0a2540", "#004b6e"],
        corPlataforma: "#1e5128",
        corDetalhe: "#4e9f3d",
        plataformas: [{x: 200, y: 330, w: 120, h: 16}, {x: 420, y: 250, w: 140, h: 16}, {x: 630, y: 330, w: 110, h: 16}],
        inimigos: [{x: 230, minX: 200, maxX: 300, y: 304, w: 26, h: 26, dir: 1, tipo: 'motobug'}, {x: 450, minX: 420, maxX: 540, y: 224, w: 24, h: 24, dir: -1, tipo: 'buzzbomber'}],
        checkpoint: {x: 480, y: 210, ativo: false},
        rings: [{x: 220, y: 290}, {x: 250, y: 290}, {x: 460, y: 210}, {x: 490, y: 210}, {x: 660, y: 290}]
      },
      {
        nome: "2. Chemical Plant",
        bg: ["#0b001a", "#1f0038", "#38006b"],
        corPlataforma: "#d97706",
        corDetalhe: "#00f5d4",
        plataformas: [{x: 150, y: 340, w: 100, h: 16}, {x: 310, y: 260, w: 160, h: 16}, {x: 540, y: 190, w: 120, h: 16}],
        inimigos: [{x: 330, minX: 310, maxX: 450, y: 234, w: 26, h: 26, dir: 1, tipo: 'crab'}, {x: 560, minX: 540, maxX: 640, y: 164, w: 24, h: 24, dir: -1, tipo: 'buzzbomber'}],
        checkpoint: {x: 380, y: 220, ativo: false},
        rings: [{x: 170, y: 300}, {x: 350, y: 220}, {x: 560, y: 150}]
      },
      {
        nome: "3. Marble Zone",
        bg: ["#140303", "#380a0a", "#661212"],
        corPlataforma: "#4a2810",
        corDetalhe: "#ef4444",
        plataformas: [{x: 180, y: 330, w: 130, h: 16}, {x: 370, y: 270, w: 100, h: 16}, {x: 530, y: 210, w: 150, h: 16}],
        inimigos: [{x: 200, minX: 180, maxX: 290, y: 304, w: 26, h: 26, dir: 1, tipo: 'bat'}],
        checkpoint: {x: 400, y: 230, ativo: false},
        rings: [{x: 200, y: 290}, {x: 400, y: 230}, {x: 570, y: 170}]
      },
      {
        nome: "4. Casino Night",
        bg: ["#0a0216", "#23083b", "#5a0e66"],
        corPlataforma: "#ff007f",
        corDetalhe: "#00f5d4",
        plataformas: [{x: 140, y: 350, w: 150, h: 16}, {x: 340, y: 280, w: 140, h: 16}, {x: 530, y: 210, w: 140, h: 16}],
        inimigos: [{x: 360, minX: 340, maxX: 460, y: 254, w: 26, h: 26, dir: 1, tipo: 'crab'}],
        checkpoint: {x: 390, y: 240, ativo: false},
        rings: [{x: 160, y: 310}, {x: 370, y: 240}, {x: 560, y: 170}]
      },
      {
        nome: "5. Ice Cap Zone",
        bg: ["#020b14", "#082846", "#0f5288"],
        corPlataforma: "#e0f2fe",
        corDetalhe: "#38bdf8",
        plataformas: [{x: 170, y: 320, w: 110, h: 16}, {x: 330, y: 240, w: 160, h: 16}, {x: 550, y: 310, w: 140, h: 16}],
        inimigos: [{x: 200, minX: 170, maxX: 260, y: 294, w: 26, h: 26, dir: 1, tipo: 'motobug'}],
        checkpoint: {x: 400, y: 200, ativo: false},
        rings: [{x: 190, y: 280}, {x: 360, y: 200}, {x: 580, y: 270}]
      },
      {
        nome: "6. Oil Ocean Zone",
        bg: ["#12100e", "#2e2419", "#573c1d"],
        corPlataforma: "#9a3412",
        corDetalhe: "#fbbf24",
        plataformas: [{x: 130, y: 340, w: 130, h: 16}, {x: 310, y: 270, w: 120, h: 16}, {x: 480, y: 200, w: 150, h: 16}],
        inimigos: [{x: 150, minX: 130, maxX: 240, y: 314, w: 26, h: 26, dir: 1, tipo: 'crab'}],
        checkpoint: {x: 340, y: 230, ativo: false},
        rings: [{x: 160, y: 300}, {x: 330, y: 230}, {x: 510, y: 160}]
      },
      {
        nome: "7. Metallic Madness",
        bg: ["#09090b", "#18181b", "#27272a"],
        corPlataforma: "#52525b",
        corDetalhe: "#f43f5e",
        plataformas: [{x: 160, y: 330, w: 120, h: 16}, {x: 340, y: 250, w: 140, h: 16}, {x: 530, y: 180, w: 160, h: 16}],
        inimigos: [{x: 180, minX: 160, maxX: 260, y: 304, w: 26, h: 26, dir: 1, tipo: 'motobug'}, {x: 560, minX: 530, maxX: 660, y: 154, w: 26, h: 26, dir: 1, tipo: 'buzzbomber'}],
        checkpoint: {x: 400, y: 210, ativo: false},
        rings: [{x: 180, y: 290}, {x: 370, y: 210}, {x: 550, y: 140}]
      },
      {
        nome: "8. Death Egg Shrine",
        bg: ["#000000", "#0e0720", "#28074d"],
        corPlataforma: "#06b6d4",
        corDetalhe: "#ec4899",
        plataformas: [{x: 250, y: 280, w: 350, h: 20}],
        inimigos: [],
        checkpoint: {x: 420, y: 240, ativo: false},
        rings: [{x: 300, y: 240}, {x: 350, y: 240}, {x: 400, y: 240}, {x: 450, y: 240}, {x: 500, y: 240}]
      }
    ];

    let projeteis = [];
    let particulas = [];
    const teclas = {};

    window.addEventListener('keydown', (e) => { teclas[e.key.toLowerCase()] = true; teclas[e.key] = true; });
    window.addEventListener('keyup', (e) => { teclas[e.key.toLowerCase()] = false; teclas[e.key] = false; });

    function vincularControlesTouch(id, chave) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); teclas[chave] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); teclas[chave] = false; });
    }
    vincularControlesTouch('btn-left', 'arrowleft');
    vincularControlesTouch('btn-right', 'arrowright');
    vincularControlesTouch('btn-jump', ' ');
    vincularControlesTouch('btn-skill', 'z');

    function selecionarPersonagem(nome) {
      personagemSelecionado = nome;
      document.querySelectorAll('.char-card').forEach(card => {
        card.classList.toggle('ativo', card.getAttribute('data-char') === nome);
      });
    }

    function carregarFase(index) {
      faseAtual = index;
      document.getElementById('hud-stage').innerText = fases[faseAtual].nome;
      jogador.x = 50;
      jogador.y = chaoY - jogador.altura;
      jogador.checkpointX = 50;
      jogador.checkpointY = chaoY - jogador.altura;
    }

    function iniciarJogo() {
      if (estadoJogo === 'JOGANDO') return;
      estadoJogo = 'JOGANDO';

      document.getElementById('menu-screen').classList.add('escondido');
      document.getElementById('victory-screen').classList.add('escondido');
      document.getElementById('game-hud').classList.add('ativo');
      document.getElementById('touch-controls').classList.add('ativo');

      totalRings = 0;
      document.getElementById('hud-rings').innerText = `RINGS: ${totalRings}`;
      carregarFase(0);

      projeteis = [];
      particulas = [];

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(loopDoJogo);
    }

    function reiniciarJogo() {
      iniciarJogo();
    }

    function exibirVitoria() {
      estadoJogo = 'VITORIA';
      document.getElementById('victory-rings-text').innerText = `TOTAL RINGS: ${totalRings}`;
      document.getElementById('victory-screen').classList.remove('escondido');
      document.getElementById('game-hud').classList.remove('ativo');
      document.getElementById('touch-controls').classList.remove('ativo');
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    function voltarAoMenu() {
      estadoJogo = 'MENU';
      document.getElementById('menu-screen').classList.remove('escondido');
      document.getElementById('victory-screen').classList.add('escondido');
      document.getElementById('game-hud').classList.remove('ativo');
      document.getElementById('touch-controls').classList.remove('ativo');
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    }

    function resuscitarJogador() {
      jogador.x = jogador.checkpointX;
      jogador.y = jogador.checkpointY;
      jogador.velocidadeY = 0;
      criarParticulas(jogador.x + 16, jogador.y + 20, '#ff2a4b', 15);
    }

    function criarParticulas(x, y, cor, qtd = 8, tamanhoBase = 4) {
      for (let i = 0; i < qtd; i++) {
        particulas.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          tamanho: Math.random() * tamanhoBase + 2,
          cor: cor, vida: 1.0, decaimento: Math.random() * 0.04 + 0.02
        });
      }
    }

    function executarHabilidade() {
      const dir = jogador.olhandoDireita ? 1 : -1;
      switch (personagemSelecionado) {
        case 'sonic':
          if (!jogador.spindashAtivo) {
            jogador.spindashAtivo = true;
            jogador.tempoSpindash = 20;
            criarParticulas(jogador.x + 16, jogador.y + 35, '#00e5ff', 10);
          }
          break;
        case 'tails':
          jogador.velocidadeY = -4.5;
          jogador.emNoChao = false;
          criarParticulas(jogador.x + 16, jogador.y + 35, '#ffcc00', 3);
          break;
        case 'knuckles':
          if (jogador.cooldownHabilidade <= 0) {
            jogador.socoAtivo = 12;
            jogador.cooldownHabilidade = 20;
            criarParticulas(jogador.x + (dir === 1 ? 35 : -5), jogador.y + 20, '#ff4d4d', 8);
          }
          break;
        case 'shadow':
          if (jogador.cooldownHabilidade <= 0) {
            projeteis.push({ x: jogador.x + (dir === 1 ? 30 : -10), y: jogador.y + 16, vx: dir * 13, largura: 18, altura: 8 });
            jogador.cooldownHabilidade = 18;
          }
          break;
        case 'amy':
          if (jogador.cooldownHabilidade <= 0) {
            jogador.marteloAtivo = 15;
            jogador.cooldownHabilidade = 25;
            criarParticulas(jogador.x + (dir === 1 ? 35 : -5), jogador.y + 20, '#ff85c0', 10);
          }
          break;
      }
    }

    function atualizar() {
      tempoGlobal += 0.05;
      const dir = jogador.olhandoDireita ? 1 : -1;
      const fase = fases[faseAtual];
      jogador.animFrame += 0.2;

      if (jogador.cooldownHabilidade > 0) jogador.cooldownHabilidade--;
      if (jogador.socoAtivo > 0) jogador.socoAtivo--;
      if (jogador.marteloAtivo > 0) jogador.marteloAtivo--;

      if (teclas['z']) executarHabilidade();

      let emMovimento = false;

      if (jogador.spindashAtivo) {
        jogador.x += dir * 14;
        jogador.tempoSpindash--;
        jogador.anguloRotacao += 0.6;
        criarParticulas(jogador.x + 16, jogador.y + 32, '#00e5ff', 2, 3);
        if (jogador.tempoSpindash <= 0) jogador.spindashAtivo = false;
      } else {
        if (teclas['arrowleft'] || teclas['a']) {
          jogador.x -= jogador.velocidadeX;
          jogador.olhandoDireita = false;
          emMovimento = true;
        }
        if (teclas['arrowright'] || teclas['d']) {
          jogador.x += jogador.velocidadeX;
          jogador.olhandoDireita = true;
          emMovimento = true;
        }

        if (emMovimento && jogador.emNoChao && Math.random() < 0.3) {
          criarParticulas(jogador.x + (dir === 1 ? 4 : 28), jogador.y + 36, 'rgba(255,255,255,0.4)', 1, 2);
        }

        if ((teclas['arrowup'] || teclas['w'] || teclas[' ']) && jogador.emNoChao) {
          jogador.velocidadeY = jogador.forcaPulo;
          jogador.emNoChao = false;
          criarParticulas(jogador.x + 16, jogador.y + 36, '#ffffff', 6, 3);
        }

        jogador.velocidadeY += jogador.gravidade;
        jogador.y += jogador.velocidadeY;
      }

      if (jogador.y + jogador.altura >= chaoY) {
        jogador.y = chaoY - jogador.altura;
        jogador.velocidadeY = 0;
        jogador.emNoChao = true;
      }

      fase.plataformas.forEach(plat => {
        if (jogador.x + jogador.largura > plat.x &&
            jogador.x < plat.x + plat.w &&
            jogador.y + jogador.altura >= plat.y &&
            jogador.y + jogador.altura <= plat.y + 10 &&
            jogador.velocidadeY >= 0) {
          jogador.y = plat.y - jogador.altura;
          jogador.velocidadeY = 0;
          jogador.emNoChao = true;
        }
      });

      // Transição de fase ou Vitória na última fase
      if (jogador.x + jogador.largura >= canvas.width) {
        if (faseAtual < fases.length - 1) {
          carregarFase(faseAtual + 1);
        } else {
          exibirVitoria();
          return;
        }
      }
      if (jogador.x < 0) jogador.x = 0;

      // Checkpoint
      let cp = fase.checkpoint;
      if (jogador.x + jogador.largura > cp.x && jogador.x < cp.x + 20 &&
          jogador.y + jogador.altura > cp.y && jogador.y < cp.y + 40) {
        if (!cp.ativo) {
          cp.ativo = true;
          jogador.checkpointX = cp.x;
          jogador.checkpointY = cp.y;
          criarParticulas(cp.x + 10, cp.y + 10, '#00e5ff', 20, 5);
        }
      }

      // Rings
      fase.rings.forEach(ring => {
        if (!ring.coletado &&
            jogador.x + jogador.largura > ring.x - 10 && jogador.x < ring.x + 10 &&
            jogador.y + jogador.altura > ring.y - 10 && jogador.y < ring.y + 10) {
          ring.coletado = true;
          totalRings++;
          document.getElementById('hud-rings').innerText = `RINGS: ${totalRings}`;
          criarParticulas(ring.x, ring.y, '#ffcc00', 12, 4);
        }
      });

      // Inimigos
      fase.inimigos.forEach((inimigo, idx) => {
        inimigo.x += inimigo.dir * 1.5;
        if (inimigo.x <= inimigo.minX || inimigo.x + inimigo.w >= inimigo.maxX) inimigo.dir *= -1;

        let atacando = jogador.spindashAtivo || jogador.socoAtivo > 0 || jogador.marteloAtivo > 0 || (!jogador.emNoChao && jogador.velocidadeY > 0);
        
        if (jogador.x + jogador.largura > inimigo.x && jogador.x < inimigo.x + inimigo.w &&
            jogador.y + jogador.altura > inimigo.y && jogador.y < inimigo.y + inimigo.h) {
          if (atacando) {
            fase.inimigos.splice(idx, 1);
            criarParticulas(inimigo.x + 12, inimigo.y + 12, '#ff2a4b', 16, 5);
            if (!jogador.emNoChao) jogador.velocidadeY = -7;
          } else {
            resuscitarJogador();
          }
        }
      });

      // Projéteis
      projeteis.forEach((p, index) => {
        p.x += p.vx;
        criarParticulas(p.x + 9, p.y + 4, '#ff2a4b', 1, 2);
        fase.inimigos.forEach((inimigo, iIdx) => {
          if (p.x + p.largura > inimigo.x && p.x < inimigo.x + inimigo.w &&
              p.y + p.altura > inimigo.y && p.y < inimigo.y + inimigo.h) {
            fase.inimigos.splice(iIdx, 1);
            projeteis.splice(index, 1);
            criarParticulas(inimigo.x + 12, inimigo.y + 12, '#ff5277', 14, 4);
          }
        });
        if (p.x < 0 || p.x > canvas.width) projeteis.splice(index, 1);
      });

      // Partículas
      particulas.forEach((pt, index) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vida -= pt.decaimento;
        if (pt.vida <= 0) particulas.splice(index, 1);
      });
    }

    function desenharCenario() {
      const fase = fases[faseAtual];

      let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, fase.bg[0]);
      grad.addColorStop(0.5, fase.bg[1]);
      grad.addColorStop(1, fase.bg[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
      for (let i = 0; i < 20; i++) {
        let starX = (i * 47 + Math.sin(tempoGlobal + i) * 10) % canvas.width;
        let starY = (i * 23) % (canvas.height - 100);
        ctx.fillRect(starX, starY, 2, 2);
      }

      let gradChao = ctx.createLinearGradient(0, chaoY, 0, canvas.height);
      gradChao.addColorStop(0, fase.corPlataforma);
      gradChao.addColorStop(1, '#05070a');
      ctx.fillStyle = gradChao;
      ctx.fillRect(0, chaoY, canvas.width, 40);

      ctx.shadowColor = fase.corDetalhe;
      ctx.shadowBlur = 10;
      ctx.fillStyle = fase.corDetalhe;
      ctx.fillRect(0, chaoY, canvas.width, 3);
      ctx.shadowBlur = 0;

      fase.plataformas.forEach(plat => {
        let gradPlat = ctx.createLinearGradient(plat.x, plat.y, plat.x, plat.y + plat.h);
        gradPlat.addColorStop(0, fase.corPlataforma);
        gradPlat.addColorStop(1, '#0c0d12');
        ctx.fillStyle = gradPlat;
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);

        ctx.shadowColor = fase.corDetalhe;
        ctx.shadowBlur = 8;
        ctx.fillStyle = fase.corDetalhe;
        ctx.fillRect(plat.x, plat.y, plat.w, 3);
        ctx.shadowBlur = 0;
      });

      let cp = fase.checkpoint;
      ctx.fillStyle = '#475569';
      ctx.fillRect(cp.x + 8, cp.y + 10, 4, 30);

      ctx.shadowColor = cp.ativo ? '#00e5ff' : '#ef4444';
      ctx.shadowBlur = 12;
      ctx.fillStyle = cp.ativo ? '#00e5ff' : '#ef4444';
      ctx.beginPath();
      ctx.arc(cp.x + 10, cp.y + 10, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      fase.rings.forEach(ring => {
        if (!ring.coletado) {
          let scaleX = Math.abs(Math.sin(tempoGlobal * 3)) * 6 + 2;
          ctx.shadowColor = '#ffcc00';
          ctx.shadowBlur = 12;
          ctx.strokeStyle = '#ffcc00';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(ring.x, ring.y, scaleX, 8, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      });

      fase.inimigos.forEach(inimigo => {
        let corInimigo = inimigo.tipo === 'buzzbomber' ? '#00b4d8' : inimigo.tipo === 'bat' ? '#a855f7' : '#ef4444';
        ctx.shadowColor = corInimigo;
        ctx.shadowBlur = 8;
        ctx.fillStyle = corInimigo;
        ctx.fillRect(inimigo.x, inimigo.y, inimigo.w, inimigo.h);
        
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(inimigo.x + (inimigo.dir === 1 ? inimigo.w - 8 : 2), inimigo.y + 4, 6, 6);
        ctx.shadowBlur = 0;
      });
    }

    function desenharPersonagem() {
      const x = jogador.x;
      const y = jogador.y;
      const dir = jogador.olhandoDireita ? 1 : -1;

      ctx.save();

      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(x + 16, chaoY - 2, 14, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      if (jogador.spindashAtivo || (!jogador.emNoChao && personagemSelecionado === 'sonic')) {
        ctx.translate(x + 16, y + 20);
        ctx.rotate(jogador.anguloRotacao);
        
        let corBola = personagemSelecionado === 'shadow' ? '#ff2a4b' : '#00e5ff';
        ctx.shadowColor = corBola;
        ctx.shadowBlur = 15;
        ctx.fillStyle = corBola;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-4, -4, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        return;
      }

      let corCorpo = '#0055ff';
      let corPele = '#fce0ad';
      let corSapato = '#ef4444';

      if (personagemSelecionado === 'tails') { corCorpo = '#ffb703'; corSapato = '#ef4444'; }
      if (personagemSelecionado === 'shadow') { corCorpo = '#18181b'; corSapato = '#ef4444'; }
      if (personagemSelecionado === 'knuckles') { corCorpo = '#dc2626'; corSapato = '#facc15'; }
      if (personagemSelecionado === 'amy') { corCorpo = '#ff66a3'; corSapato = '#ff4d94'; }

      ctx.shadowColor = corCorpo;
      ctx.shadowBlur = 6;

      ctx.fillStyle = corCorpo;
      ctx.fillRect(x + 8, y + 14, 16, 16);

      ctx.fillStyle = corPele;
      ctx.fillRect(x + (dir === 1 ? 14 : 10), y + 16, 8, 10);

      ctx.fillStyle = corCorpo;
      ctx.fillRect(x + 4, y + 2, 24, 16);

      ctx.fillRect(x + (dir === 1 ? 0 : 22), y + 6, 8, 8);
      ctx.fillRect(x + (dir === 1 ? 2 : 20), y + 12, 6, 6);

      if (personagemSelecionado === 'shadow') {
        ctx.fillStyle = '#ff2a4b';
        ctx.fillRect(x + (dir === 1 ? 0 : 24), y + 4, 6, 4);
      }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + (dir === 1 ? 16 : 6), y + 4, 10, 10);
      
      ctx.fillStyle = personagemSelecionado === 'shadow' ? '#ff2a4b' : (personagemSelecionado === 'sonic' ? '#00b4d8' : '#000000');
      ctx.fillRect(x + (dir === 1 ? 22 : 6), y + 7, 4, 5);

      ctx.fillStyle = corPele;
      ctx.fillRect(x + (dir === 1 ? 18 : 6), y + 10, 8, 6);

      ctx.shadowBlur = 0;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + (dir === 1 ? 20 : 4), y + 18, 6, 6);

      ctx.fillStyle = corSapato;
      ctx.fillRect(x + 4, y + 30, 10, 8);
      ctx.fillRect(x + 18, y + 30, 10, 8);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + 4, y + 33, 10, 2);
      ctx.fillRect(x + 18, y + 33, 10, 2);

      if (jogador.socoAtivo > 0) {
        ctx.shadowColor = '#ffb703';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffb703';
        ctx.fillRect(x + (dir === 1 ? 26 : -12), y + 12, 18, 12);
        ctx.shadowBlur = 0;
      }

      if (jogador.marteloAtivo > 0) {
        ctx.shadowColor = '#ff4d94';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#ff4d94';
        ctx.fillRect(x + (dir === 1 ? 22 : -14), y - 10, 24, 28);
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    }

    function desenhar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      desenharCenario();

      particulas.forEach(pt => {
        ctx.shadowColor = pt.cor;
        ctx.shadowBlur = 6;
        ctx.fillStyle = pt.cor;
        ctx.globalAlpha = pt.vida;
        ctx.fillRect(pt.x, pt.y, pt.tamanho, pt.tamanho);
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
      });

      projeteis.forEach(p => {
        ctx.shadowColor = '#ff2a4b';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ff5277';
        ctx.fillRect(p.x, p.y, p.largura, p.altura);
        ctx.shadowBlur = 0;
      });

      desenharPersonagem();
    }

    function loopDoJogo() {
      if (estadoJogo === 'JOGANDO') {
        atualizar();
        desenhar();
        animationFrameId = requestAnimationFrame(loopDoJogo);
      }
    }

    desenharCenario();
  </script>
